# Local or single-host deployment. For production in AWS ap-southeast-2 see docs/DEPLOY.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: practy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-practy}
      POSTGRES_DB: practy
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practy"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://practy:${POSTGRES_PASSWORD:-practy}@db:5432/practy
    ports: ["3000:3000"]
    volumes: [docs:/app/data]
volumes:
  db: {}
  docs: {}
